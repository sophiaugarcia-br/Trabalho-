<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="static/site.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <title>Seu mais novo gerenciador de finanças</title>
</head>

<body>
    <div class="container">
        <h1>Seja bem-vindo ao</h1>
        <h1>Finant</h1>
    </div>
    <h2>Sua mais nova ferramenta de gerenciamento de finanças</h2>
   <main class="menu">   
        <div class="cards">
            <div class="left-column">
                <section class="balance-card">
                    <div class="balance-text">
                        <p class="balance-wallet">Minha Carteira</p>
                        <p class="saldo">Saldo Atual</p>
                        <p class="money">R$ 500</p>
                        <p class="varia">Úlitmos 7 dias: +R$60</p>
                    </div>
            </div>
                </section>
            <section class="chart-card">
                <div class="chart-box">
                    <canvas id="myChart"></canvas>
                </div>
            </section>
            <section class="side-card">
                <div class="side-box">
                    <p class="transactions">Transações</p>
                </div>
            </section>
        </div>
        <script>
        const labels = ["Moradia", "Alimentação", "Transporte", "Lazer", "Outros"];
        const values = [40, 30, 15, 10, 5];
        const colors = [
        "#b91d47",
        "#00aba9",
        "#2b5797",
        "#e8c3b9",
        "#1e7145"
        ];

        new Chart(document.getElementById("myChart"), {
            type: "doughnut",
            data: {
                labels: labels,
                datasets: [{ backgroundColor: colors, data: values }]
            },
            options: {
                maintainAspectRatio: false, 
                plugins: {
                    legend: { display: true },
                    title: {
                        display: true,
                        text: "Suas finanças pessoais - conosco",
                        font: { size: 16 }
                    }
                }
            }
        });
        </script>
    </main> 
</body>
</html>
