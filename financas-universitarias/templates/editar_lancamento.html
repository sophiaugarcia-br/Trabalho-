{% extends "base.html" %}

{% block conteudo %}
<section class="add-card">
    <h3>Editar transação</h3>
    <form action="{{ url_for('lancamentos.editar', transacao_id=t['id']) }}" method="POST" class="transaction-form">
        <input type="text" name="descricao" value="{{ t['descricao'] }}" required>
        <input type="number" step="0.01" name="valor" value="{{ t['valor'] }}" required>
        <input type="date" name="data" value="{{ t['data'] }}" required>

        <select name="tipo" required>
            <option value="Receita" {% if t['tipo'] == 'Receita' %}selected{% endif %}>Receita</option>
            <option value="Despesa" {% if t['tipo'] == 'Despesa' %}selected{% endif %}>Despesa</option>
        </select>

        <select name="categoria_id" required>
            {% for cat in categorias %}
                <option value="{{ cat['id'] }}" {% if cat['id'] == t['categoria_id'] %}selected{% endif %}>
                    {{ cat['nome'] }} ({{ cat['tipo'] }})
                </option>
            {% endfor %}
        </select>

        <button type="submit">Salvar alterações</button>
    </form>
    <p><a href="{{ url_for('lancamentos.listar') }}" class="botao-cancelar">Cancelar</a></p>
</section>
{% endblock %}
